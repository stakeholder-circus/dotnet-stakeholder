name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet format dotnet-stakeholder.sln --verify-no-changes
      - run: dotnet build dotnet-stakeholder.sln
      - run: dotnet test dotnet-stakeholder.sln
      - if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -t dotnet-stakeholder .
          docker run --rm dotnet-stakeholder --list-values
